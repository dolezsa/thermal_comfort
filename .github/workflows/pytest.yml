name: Run PyTest Unit Tests

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Home Assistant (2025.8.0)
          - python-version: "3.13"
            test-package: "pytest-homeassistant-custom-component==0.13.269"
          # Latest Home Assistant
          - python-version: "3.14"
            test-package: "pytest-homeassistant-custom-component"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt "${{ matrix.test-package }}"
      - name: Pin pycares for the oldest Home Assistant
        # aiodns 3.5.0 (pinned by Home Assistant 2025.8) is incompatible with pycares 5
        if: matrix.python-version == '3.13'
        run: pip install "pycares<5"
      - name: Test with pytest
        run: |
          pytest
