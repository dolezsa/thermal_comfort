name: Run PyTest Unit Tests

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest tested Home Assistant (2025.1.4)
          - python-version: "3.12"
            test-package: "pytest-homeassistant-custom-component==0.13.205"
          # Latest Home Assistant
          - python-version: "3.14"
            test-package: "pytest-homeassistant-custom-component"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt "${{ matrix.test-package }}"
      - name: Test with pytest
        run: |
          pytest
